# Codegen fixes for default.xex (Skylanders: Giants, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from SwapForceRecomp, SSARecomp or GiantsRecomp by
# TheBiemGamer apply to their own executables only and are checked against this one first.
#
# Entries are added as codegen and the runtime report them.

# Four jump tables in the Bink bit-stream decoder whose index is built from masked bits with no
# bounds check, so codegen guessed too few entries (4, 8, 4, 8) and the generated switch trapped:
# the first boot ended with 0xC000001D right after the Activision logo. Each table has exactly 11
# code addresses, read from guest memory with the input script's `dump` (the 12th word is an
# instruction); the registers are the ones the generated switches use. Found first by
# TheBiemGamer (GiantsRecomp, MIT, same default.xex), checked here.
# sub_821658B8: index r7 = bits & 7 for 0..6, (bits & 3) + 7 for 7..10; table at 0x821659A8.
[[switch_tables]]
address = 0x821659A4
register = 7
labels = [0x821659D4, 0x821659F4, 0x82165B90, 0x82165D2C, 0x82165EC8, 0x82166064, 0x82166200, 0x8216639C, 0x82166538, 0x82166720, 0x82166908]

# sub_82166B30, table at 0x82166BEC.
[[switch_tables]]
address = 0x82166BE8
register = 19
labels = [0x82166C18, 0x82166C40, 0x82166E24, 0x82167008, 0x821671EC, 0x821673D0, 0x821675B4, 0x82167798, 0x8216797C, 0x82167BAC, 0x82167DDC]

# sub_8216A958, table at 0x8216AA08.
[[switch_tables]]
address = 0x8216AA04
register = 10
labels = [0x8216AA34, 0x8216AA48, 0x8216AA98, 0x8216AAE8, 0x8216AB38, 0x8216AB88, 0x8216ABD0, 0x8216AC20, 0x8216AC70, 0x8216ACEC, 0x8216AD68]

# sub_82169318, table at 0x821693D4.
[[switch_tables]]
address = 0x821693D0
register = 20
labels = [0x82169400, 0x82169410, 0x82169598, 0x82169720, 0x821698A8, 0x82169A30, 0x82169BB8, 0x82169D40, 0x82169EC8, 0x8216A074, 0x8216A220]

# 0x82153DB0 is in BinkOpen (sub_82153BE8, Bink 2), right after it reads the 44-byte header into
# r1+96 and just before the "KB2e" signature compare; the file and the in-memory header path both
# branch here. Found by TheBiemGamer (GiantsRecomp, MIT, same default.xex), checked in this
# project's generated code. src/hooks/intro_skip_hook.cpp cuts the logo movies (skip_intro, on)
# and optionally the opening movie (skip_opening_movie, off) by setting their frame count to 1;
# other movies pass unchanged.
[[midasm_hook]]
address = 0x82153DB0
name = "BinkHeaderLoaded"
registers = ["r1"]

# 0x8217F350 is in the tfbXenonApplication setup (sub_8217F2D8), the compare of XGetGameRegion's
# result (r3) that picks the European or the North American language set; the disc has the text of
# both. src/hooks/language_region_hook.cpp reports the European region there when German or
# Italian is chosen, so the game loads GERMAN.pak / ITALIAN.pak instead of falling back to English.
# Found in the generated code; only this call site sees the changed value.
[[midasm_hook]]
address = 0x8217F350
name = "GameRegionForLanguage"
registers = ["r3"]

# 0x822F197C is in the game clock's step (sub_822F18D8, called once per frame from sub_8223C4B8):
# the compare of this frame's time step (f0) with the clock's minimum step (f13, loaded from +0x10
# of the clock, r31) that would raise shorter steps to the minimum (the Cemu packs for the Wii U
# version patch out such a clamp against a speed-up above 120 FPS). Here the minimum is 0, so it
# never does: src/hooks/game_clock_hook.cpp only logs the minimum and, with game_clock_log, the game
# time against real time (speed 1.000 measured at 230-240 FPS). It changes nothing. Found
# 2026-10-20 in the Ghidra listing and checked in the generated code.
[[midasm_hook]]
address = 0x822F197C
name = "GameClockMinStepHook"
registers = ["f0", "f13", "r31"]

[functions]
# Function starts the analyzer put one instruction late (SSARecomp #33 / GiantsRecomp #23), found in
# the whole code (a dump of guest memory with the input script's `save`): right after a `blr`, an
# instruction that is no known start, followed by one that is. A function the analyzer reached
# through a branch to its second instruction while its real start is only in a pointer table; such a
# function, when called, ends the game with "Call to invalid or unregistered function". The same
# search found the ones SuperChargersRecomp and ImaginatorsRecomp crashed on at boot, and their
# entries fixed it. A start that was in fact the second half of the function before only splits it,
# which the generated code handles as a tail call. No size given, the analyzer finds the end.
0x821D73AC = {}
0x8245C178 = {}
0x8248111C = {}
0x824AE338 = {}
0x824F7F10 = {}
0x82508A58 = {}
0x82580810 = {}
0x82598FF4 = {}
0x825990D4 = {}
